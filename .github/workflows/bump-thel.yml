name: bump-thel

# Bump Casks/thel.rb to the latest thel release. The cask carries a per-platform
# version + sha256 (an unsigned macOS .dmg and a Linux x86_64 tarball), so
# this updates whichever of them the latest release ships. Run it manually after
# publishing a release; it opens a PR when there's something to bump.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c915c33a16f01166c17c4e35fe1d4085a2d71adb # v4

      - name: Bump the cask to the latest thel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repo=joaquimrocha/thel
          # releases/latest ignores prereleases, so fall back to the newest
          # non-draft release if every release is flagged prerelease.
          tag=$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null \
            || gh api "repos/$repo/releases" --jq '[.[] | select(.draft | not)][0].tag_name')
          [ -n "$tag" ] || { echo "no published release found" >&2; exit 1; }
          version=${tag#v}
          names=$(gh api "repos/$repo/releases/tags/$tag" --jq '.assets[].name')

          dl_sha() {
            curl -fsSL "https://github.com/$repo/releases/download/$tag/$1" | sha256sum | cut -d' ' -f1
          }

          # Linux x86_64 tarball -> the on_linux block (version, sha256, tarball ext).
          linux=$(printf '%s\n' "$names" | grep -E '^thel-.*linux-x86_64\.tar\.(gz|xz)$' | head -1 || true)
          if [ -n "$linux" ]; then
            ext=${linux##*.tar.}
            sha=$(dl_sha "$linux")
            sed -i \
              -e "/on_linux do/,/^  end/ s/^\( *version \).*/\1\"$version\"/" \
              -e "/on_linux do/,/^  end/ s/^\( *sha256 \).*/\1\"$sha\"/" \
              -e "/on_linux do/,/^  end/ s/linux-x86_64\.tar\.[a-z]*\"/linux-x86_64.tar.$ext\"/" \
              Casks/thel.rb
          fi

          # Apple-silicon .dmg -> the on_macos block (version, sha256).
          mac=$(printf '%s\n' "$names" | grep -E '^thel_.*_aarch64\.dmg$' | head -1 || true)
          if [ -n "$mac" ]; then
            sha=$(dl_sha "$mac")
            sed -i \
              -e "/on_macos do/,/^  end/ s/^\( *version \).*/\1\"$version\"/" \
              -e "/on_macos do/,/^  end/ s/^\( *sha256 \).*/\1\"$sha\"/" \
              Casks/thel.rb
          fi

          [ -n "$linux$mac" ] || { echo "release $tag has no linux x86_64 tarball or macOS dmg yet" >&2; exit 1; }

          git diff --quiet Casks/thel.rb && { echo "cask already up to date for $tag"; exit 0; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="bump-thel-$version"
          git checkout -b "$branch"
          git commit -am "thel $version"
          # Force-push so a re-run of the workflow refreshes the same PR branch.
          git push -fu origin "$branch"
          if [ "$(gh pr list --head "$branch" --json number --jq length)" = 0 ]; then
            gh pr create --base main --head "$branch" --title "thel $version" \
              --body "Automated cask bump to [$tag](https://github.com/$repo/releases/tag/$tag)."
          fi
